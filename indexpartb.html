<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="todo-card">
    <header>
      <h1>To-Do List</h1>
      <p class="subtitle">Vanilla JS • Event Delegation • Live Counter</p>
    </header>

    <!-- Task Form -->
    <form id="todoForm" novalidate>
      <div class="input-container">
        <input 
          type="text" 
          id="taskInput" 
          placeholder="What needs to be done?" 
          autocomplete="off"
        >
        <button type="submit" id="addBtn">Add</button>
      </div>
      <p id="errorMessage" class="error-msg"></p>
    </form>

    <!-- Filters -->
    <div class="filter-group">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>

    <!-- Task List (Event Delegation Container) -->
    <ul id="taskList" class="task-list"></ul>

    <!-- Footer Counter & Actions -->
    <footer class="todo-footer">
      <div class="task-counter">
        Total: <span id="totalCount">0</span> | Remaining: <span id="remainingCount">0</span>
      </div>
      <button id="clearCompletedBtn" class="clear-btn">Clear completed</button>
    </footer>

    <p class="tip-text">Tip: double-click a task to edit it. Press <kbd>Enter</kbd> to save, <kbd>Esc</kbd> to cancel.</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
